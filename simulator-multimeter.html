<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulator Multimeter TMG</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172633;background:#f4f7f7;--ink:#172633;--teal:#006965;--border:#c8d6d6}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
header{background:#172a36;color:white}
header>div{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 18px}
header a{color:inherit;text-decoration:none;font-weight:650}
h1,h2,p{margin:0}
h1{font-size:clamp(1.05rem,3vw,1.5rem)}
h2{font-size:1.03rem}
button,select,input,textarea{font:inherit}
button,select{color:var(--ink);border:1px solid var(--border);border-radius:9px;background:#fff;padding:8px 12px;min-height:42px;font-weight:650}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,.point:focus-visible{outline:3px solid #138d84;outline-offset:3px}
button:disabled{opacity:.55;cursor:default}
.primary,#modes button[aria-pressed=true],.probes button[aria-pressed=true]{background:var(--teal);color:white;border-color:var(--teal)}
main{max-width:1100px;margin:auto;padding:14px 18px 22px}
#modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;justify-items:center;gap:clamp(10px,4vw,50px);background:repeating-linear-gradient(3deg,#e4d6c41f 0 3px,#d7bea11c 4px 8px),linear-gradient(125deg,#f0e6d7,#d7c3a8);position:relative;border:1px solid #d0c2ae;border-radius:15px;padding:16px clamp(12px,4vw,52px) 25px;overflow:hidden}
.meter{width:min(100%,345px);position:relative;align-self:center;filter:drop-shadow(0 7px 7px #33231345)}
.meter>svg,.board>svg,#zoomDialog svg{display:block;width:100%;height:auto}
.overlay{position:absolute;background:transparent;border:0;padding:0;min-height:0;z-index:4}
.scale{left:5%;top:5%;width:89%;height:38%;text-align:right;padding:5px 8px;color:#143a41;font-size:20px;display:flex;justify-content:flex-end;align-items:flex-start}
.knob{left:20%;top:64%;width:39%;height:27%;border-radius:50%;touch-action:none;cursor:grab}
.zero{left:76%;top:49%;width:20%;height:14%;border-radius:50%;touch-action:none;cursor:grab}
.jack{position:absolute;left:88.5%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);z-index:3;border:2px solid #fff6}
.jack.red{top:76.6%;background:#b7292e}.jack.black{top:89.8%;background:#24282b}
.station{width:min(100%,430px);display:grid;gap:10px}
.station h2{position:relative;z-index:3}
.board{position:relative;background:#f8edd7;border:1px solid #b6a28a;border-radius:14px;box-shadow:0 6px 0 #aa8d6f,0 10px 15px #33231326;overflow:visible}
.point{position:absolute;transform:translate(-50%,-50%);border-radius:50%;padding:0;width:36px;height:36px;min-height:0;background:transparent;border:2px solid transparent;z-index:4}
.point:hover,.point:focus-visible{border-color:#007d73}
.point[data-touch=red]{border-color:#a4282c}.point[data-touch=black]{border-color:#222}
.point[data-touch=both]{border-color:#a4282c #222 #222 #a4282c}
.leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;overflow:visible}
.probes,.controls,.answer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.probes{position:relative;z-index:3}.probes button{flex:1;white-space:nowrap;font-size:.85rem;padding:7px}
.probes i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#30343a;margin-right:3px}
.probes [data-probe=red] i{background:#b7292e}
.controls{margin-top:12px}.controls label{font-weight:650}
#status{min-height:2.5em;margin-top:8px;color:#344c55}
.answer{background:white;border:1px solid var(--border);border-radius:12px;padding:10px}
.answer label{font-weight:650}
input,textarea{padding:8px 10px;min-height:42px;border:1px solid var(--border);border-radius:8px;color:var(--ink);background:#fff}
.answer input{flex:1;min-width:110px}
.answer button{margin-left:auto}
dialog{border:1px solid var(--border);border-radius:14px;padding:16px;width:min(530px,calc(100% - 24px));color:var(--ink);max-height:90vh}
dialog::backdrop{background:#142531a8}
.dialogTop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
#zoomDialog{width:min(900px,calc(100% - 16px))}
#guideDialog li{margin-bottom:8px}
form,form label{display:grid;gap:6px}form{gap:12px}
@media(max-width:570px){header>div,main{padding-left:9px;padding-right:9px}header a,header button{font-size:.8rem}header button{padding:5px 7px}#modes{grid-template-columns:repeat(2,1fr)}.bench{grid-template-columns:1.05fr 1fr;gap:8px;padding:10px 6px 20px}.station{gap:7px}.probes{gap:4px}.probes button{font-size:.74rem;min-height:34px;padding:4px}.station h2{font-size:.82rem}.jack{width:7px;height:7px}.point{width:28px;height:28px}.answer button{width:100%}.controls{gap:5px}.controls button,.controls select{font-size:.84rem;padding:5px 7px}}
:root{--teal:#006d63}
.assetDefs{position:absolute;width:0;height:0;overflow:hidden}
#modes{grid-template-columns:repeat(5,minmax(0,1fr))}
.bench{padding-bottom:68px;gap:18px;overflow:hidden}
.station{min-width:0}
.board{isolation:isolate}
.board>svg{overflow:hidden}
.point{z-index:4}
.point.near,.point[data-touch=wire]{border-color:#008579;box-shadow:0 0 0 3px #38a99355}
#rack{display:flex;gap:5px;flex-wrap:wrap;padding:2px}
#rack button{flex:none;font-size:.72rem;min-height:29px;padding:4px 6px;touch-action:pan-y}
#rack button>svg{width:27px;height:13px;vertical-align:middle;margin-right:3px}
#rack button{touch-action:none}
#rack button:disabled{cursor:default}
.probeObject{position:absolute;z-index:5;width:25px;height:119px;border:0;background:transparent;padding:0;min-height:0;touch-action:none;transform-origin:center top;cursor:grab;box-shadow:none}
.probeObject::after{content:"";position:absolute;inset:17% -15px -5px}
.probeObject[data-selected=true]{filter:drop-shadow(0 0 3px #007c7180)}
.probeObject[data-dragging=true]{z-index:9}
.probeObject{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.probeObject svg{display:block;width:100%;height:100%;overflow:hidden;pointer-events:none}
.probeObject:active{cursor:grabbing}
#coverHandle{position:absolute;z-index:3;left:34%;width:32%;top:21.6%;font-size:.68rem;padding:3px;min-height:24px;touch-action:none;background:#f0f4ef;color:#2b3d43;border-color:#8e9a9c;transform:translateY(3px);cursor:grab}
#coverHandle[aria-pressed=true]{top:0!important}
#rangeLabel{font-weight:750;background:#d9ede8;color:#164a45;border-radius:9px;padding:9px 11px}
.controls button[aria-pressed=true]{background:#d9ede8;border-color:#5e9c91}
#wireAnswers{display:flex;flex-wrap:wrap;gap:6px 9px}
#wireAnswers label{display:grid;gap:3px;font-size:.8rem}
#wireAnswers select{font-size:.84rem;padding:5px}
#ghost{position:fixed;z-index:20;transform:translate(-50%,-115%);padding:6px 10px;border-radius:8px;color:white;background:#194743;pointer-events:none;font-size:.8rem}
@media(max-width:650px){#modes{grid-template-columns:repeat(3,1fr)}#modes button{font-size:.79rem;padding:6px} .bench{gap:7px;padding-bottom:57px}.probeObject{height:88px;width:19px}.point{width:23px;height:23px}#rack button{font-size:.61rem;min-height:24px;padding:2px 4px}#rack button>svg{width:18px;height:10px}.station h2{font-size:.77rem}#coverHandle{font-size:.54rem;min-height:19px}#wireAnswers{width:100%;justify-content:space-between}#wireAnswers select{min-height:34px}}

.station{align-self:start}
#rackArea{order:2}
#rackHandle{width:100%;text-align:left;touch-action:none}
#rack{background:#e6ded0;border:1px solid #b6a28a;border-radius:8px;margin-top:4px;padding:5px}
#rackArea #random{margin-top:5px}
#rack:not([hidden]){animation:rackSlide .17s ease-out}
@keyframes rackSlide{from{opacity:.35;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#rack:not([hidden]){animation:none}}
.controls:has(>button[hidden]){display:none}
.boardPart,.wireEnd,.boardSwitch{position:absolute;transform:translate(-50%,-50%);min-height:0;padding:0;touch-action:none}
.boardPart{width:25%;height:14%;z-index:2;border:0;background:transparent;cursor:grab}
.wireEnd{width:30px;height:30px;border:0;border-radius:50%;background:transparent;color:white;z-index:5;cursor:grab;display:grid;place-items:center;font-size:15px;font-weight:800}
.wireEnd::before{content:"×";display:grid;place-items:center;background:#266960;border:1px solid #d4f0e5;border-radius:50%;width:19px;height:19px;line-height:1;pointer-events:none}
.point{touch-action:none}
.boardSwitch{background:#263d40;color:#fff;border:1px solid #84928e;border-radius:6px;width:clamp(24px,8%,38px);height:clamp(19px,9%,32px);font-size:clamp(8px,1.8vw,11px);z-index:5}
.boardSwitch[aria-pressed=true]{background:#147456}
#status.warning{background:#f9dfd7;color:#862e24;border-radius:8px;padding:6px 9px}
#roundInfo,#examReview{width:100%;font-weight:650}
#examReview li{font-weight:400;margin-bottom:6px}
#guideContent svg{width:100%;display:block}
#guideContent h3{margin:.8em 0 .35em}
#guideContent ol,#guideContent ul{padding-left:1.4em}
#confirmExam{margin-top:12px}
@media(max-width:650px){.wireEnd{width:26px;height:26px;font-size:13px}.wireEnd::before{width:16px;height:16px}.bench{padding-bottom:76px}}
#wireAnswers{width:100%;gap:8px 12px}
#wireAnswers label{color:#21333b;font-weight:650}
#wireAnswers label span{display:flex;align-items:center;gap:6px}
#wireAnswers label span::before{content:"";width:12px;height:12px;border:1px solid #68757a;border-radius:50%;background:var(--wire)}
.boardSwitch{width:clamp(34px,13%,52px);height:clamp(26px,12%,39px);z-index:6}
</style>

</head>

function batteryVoltage(from,to) {
 const adjacency=new Map();
 function edge(a,b,v) {
  if(!adjacency.has(a)) adjacency.set(a,[]);
  adjacency.get(a).push([b,v]);
 }
 state.cells.forEach((cell,i)=>{
  const v=cells[cell][2];
  edge(i+'A',i+'B',v); edge(i+'B',i+'A',-v);
 });
 for(const [a,b] of state.links.dcv) {edge(a,b,0);edge(b,a,0);}
 const known=new Map([[from,0]]), queue=[from];
 for(const node of queue) for(const [next,v] of adjacency.get(node)||[]) {
  const voltage=known.get(node)+v;
  if(!known.has(next)) {known.set(next,voltage);queue.push(next);}
  else if(Math.abs(known.get(next)-voltage)>.0001) return NaN;
 }
 return known.get(to);
}
function resistorEquivalent(from,to) {
 const nodes=state.resistors.flatMap((_,i)=>[i+'A',i+'B']);
 const groups=new Map(nodes.map(n=>[n,n]));
 function root(n) {while(groups.get(n)!==n) n=groups.get(n);return n;}
 for(const [a,b] of state.links.ohm) groups.set(root(a),root(b));
 const source=root(from), ground=root(to);
 if(source===ground) return 0;
 const edges=state.resistors.map((r,i)=>[root(i+'A'),root(i+'B'),1/r.actual]).filter(([a,b])=>a!==b);
 const connected=new Set([source]);
 for(const n of connected) for(const [a,b] of edges) {
  if(a===n) connected.add(b);
  if(b===n) connected.add(a);
 }
 if(!connected.has(ground)) return Infinity;
 const live=[...connected].filter(n=>n!==ground);
 const mat=live.map((n,i)=>Array.from({length:live.length+1},(_,j)=>j===live.length?Number(i===0):0));
 for(const [a,b,g] of edges) {
  const i=live.indexOf(a), j=live.indexOf(b);
  if(i>=0) mat[i][i]+=g;
  if(j>=0) mat[j][j]+=g;
  if(i>=0&&j>=0) {mat[i][j]-=g;mat[j][i]-=g;}
 }
 // Solve nodal voltages for a 1 A test current.
 for(let i=0;i<live.length;i++) {
  const divisor=mat[i][i];
  for(let j=i;j<=live.length;j++) mat[i][j]/=divisor;
  for(let k=0;k<live.length;k++) if(k!==i) {
   const factor=mat[k][i];
   for(let j=i;j<=live.length;j++) mat[k][j]-=factor*mat[i][j];
  }
 }
 return mat[0].at(-1);

<script>
/* ==========================================================================
   SEMATAN SUPER APP — ditambahkan untuk Super APP Jurusan TE (SIMBioTE).
   Logika simulator tidak diubah. Bagian ini dibuat oleh sematan/pasang.py dari
   sematan/inti.js + sematan/<simulator>.js; ubah di sana, jangan di sini.
   Aktif hanya dengan ?sematan=1 di dalam iframe. Pesan {alat, v:1, tipe, ...}:
     induk → alat   muat {berkas}   minta   soal {soal}
     alat → induk   siap {versiApp, versiBerkas}   dimuat {galat}   berkas {berkas}
                    berubah {berkas} (ditunda 0,6 dtk setelah pengguna mengubah isi)
   ?pratinjau=1: guru melihat hasil siswa; tidak ada pesan "berubah".
   ========================================================================== */
(function () {
  var prm = new URLSearchParams(location.search);
  if (prm.get('sematan') !== '1' || window.parent === window) return;
  var PRATINJAU = prm.get('pratinjau') === '1';
  var ALAT = 'simmeter';
  var A = (function (PRATINJAU) {
  // Berkas = data kiriman tugas bawaan (format MULTIMETER-1 versi 4 + penilaian lima ronde);
  // kosong sebelum job selesai.
  return {
    versi: 'multimeter-tmg+sematan1',
    ambil: function () {
      if (!exam || !exam.done) return '';
      var answer = state.mode === 'continuity'
        ? exam.rounds.reduce(function (mask, round, i) { return mask + (round.answer << i); }, 0)
        : exam.rounds[exam.rounds.length - 1].answer;
      return JSON.stringify(Object.assign({ format: format, version: 4 }, state, {
        answer: answer,
        assessment: { rounds: exam.rounds, errors: exam.errors },
      }));
    },
    muat: function (teks) {
      var d = JSON.parse(teks);
      if (PRATINJAU) {
        reviewing = true;
        document.querySelectorAll('[data-mode],[data-probe],.controls button,#answer,#wireAnswers select,#dial,#zeroDial,#coverHandle')
          .forEach(function (el) { el.disabled = true; });
        $('examReview').replaceChildren();
        applySubmission(d);
        statusOverride = 'Kiriman siswa dimuat. Jawaban tertera di bawah.';
        refresh();
        return;
      }
      exam = null;
      applySubmission(d);
      // Siswa membuka lagi hasil job yang sudah selesai (acuan tidak ditampilkan).
      $('examReview').replaceChildren();
      var a = d.assessment;
      if (a && Array.isArray(a.rounds) && a.rounds.length === 5)
        exam = { rounds: a.rounds, errors: Array.isArray(a.errors) ? a.errors : [], pool: [],
          previous: practiceSnapshot(), done: true, sent: false, target: a.rounds[4] };
      drawRack(); drawBoard(); refresh();
    },
    // Pengaturan tugas dari guru: {mode} = praktikum yang wajib dikerjakan; mode lain disembunyikan.
    soal: function (s) {
      var mode = s && s.mode;
      if (!mode || !Object.prototype.hasOwnProperty.call(modes, mode)) return;
      document.querySelectorAll('[data-mode]').forEach(function (b) { b.hidden = b.dataset.mode !== mode; });
      if (!exam && !reviewing) setMode(mode);
    },
  };
})(PRATINJAU);
  document.documentElement.classList.add('sematan');
  if (PRATINJAU) document.documentElement.classList.add('pratinjau');
  var asal = location.origin;
  try { if (document.referrer) asal = new URL(document.referrer).origin; } catch (e) {}
  var izin = [location.origin, asal];
  function kirim(tipe, isi) {
    try { parent.postMessage(Object.assign({ alat: ALAT, v: 1, tipe: tipe }, isi || {}), asal); } catch (e) {}
  }
  function isi() {
    try { return A.ambil() || ''; } catch (e) { return ''; }
  }
  var terakhir = '', jam = null;
  function periksa() {
    if (PRATINJAU) return;
    var b = isi();
    if (b && b !== terakhir) { terakhir = b; kirim('berubah', { berkas: b }); }
  }
  function tunda() { clearTimeout(jam); jam = setTimeout(periksa, 600); }
  ['input', 'change', 'pointerup', 'keyup', 'click', 'drop'].forEach(function (t) {
    document.addEventListener(t, tunda, true);
  });
  setInterval(periksa, 3000);
  addEventListener('message', function (e) {
    var m = e.data;
    if (e.source !== parent || izin.indexOf(e.origin) < 0) return;
    if (!m || m.alat !== ALAT || m.v !== 1) return;
    if (m.tipe === 'muat') {
      if (typeof m.berkas !== 'string') { kirim('dimuat', { galat: 'Isi berkas tidak ada' }); return; }
      clearTimeout(jam);
      Promise.resolve()
        .then(function () { return m.berkas.trim() ? A.muat(m.berkas) : null; })
        .then(
          function () { terakhir = isi(); kirim('dimuat', { galat: null }); },
          function (err) {
            kirim('dimuat', { galat: err instanceof SyntaxError ? 'Berkas bukan JSON yang sah' : String((err && err.message) || err) });
          }
        );
    } else if (m.tipe === 'minta') {
      clearTimeout(jam);
      var b = isi();
      if (b) terakhir = b;
      kirim('berkas', { berkas: b });
    } else if (m.tipe === 'soal' && A.soal) {
      try { A.soal(m.soal); } catch (err) {}
      terakhir = isi();
    }
  });
  terakhir = isi();
  kirim('siap', { versiApp: A.versi, versiBerkas: 1 });
})();

<script>

(function () {

    '.kb-baris{display:flex;gap:10px;justify-content:center;margin-top:12px}' +
    '.kb-baris button{font:800 20px/1 system-ui,sans-serif;min-width:64px;height:48px;border-radius:12px;border:1px solid #c8d1d6;background:#fff;color:#14202a}' +

    '.kb-pilih button{font:700 13px/1 system-ui,sans-serif;padding:8px 10px;border-radius:999px;border:1px solid #c8d1d6;background:#fff;color:#14202a}' +

    '.kb-petunjuk{font-size:12px;font-weight:500;color:#52606a;margin:10px 0 0}';

  var awal = null; // {x, y, el, id}

  function tumpukan(k) {
    var r = k.getBoundingClientRect();
    var pusat = function (x) { var q = x.getBoundingClientRect(); return { x: q.left + q.width / 2, y: q.top + q.height / 2, q: q }; };

      var c = k.cloneNode(true);
      c.removeAttribute('id');
      c.querySelectorAll('[id]').forEach(function (x) { x.removeAttribute('id'); });
      var r = k.getBoundingClientRect();
      var w = r.width || 40, h = r.height || 40;
      var skala = (putar.clientWidth * 0.62) / Math.max(w, h);
      c.style.cssText += ';position:static;left:auto;top:auto;margin:0;width:' + w + 'px;height:' + h + 'px';
      tiruan.style.width = w + 'px';
      tiruan.style.height = h + 'px';
      tiruan.style.transform = 'translate(-50%,-50%) scale(' + skala + ')';
      tiruan.replaceChildren(c);
      nilai.textContent = k.getAttribute('aria-valuetext') || k.getAttribute('aria-valuenow') || '';
      jejak.style.transform = 'rotate(' + sudutJejak + 'deg)';
    }
    function langkah(n) {
      for (var i = 0; i < Math.abs(n); i++) tekan(k, n);
      requestAnimationFrame(gambar);
    }
    gambar();

    var seret = null;
    function sudut(e) {
      var r = putar.getBoundingClientRect();
      return Math.atan2(e.clientX - r.left - r.width / 2, r.top + r.height / 2 - e.clientY) * 180 / Math.PI;
    }
    putar.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      seret = { id: e.pointerId, a: sudut(e), sisa: 0 };
      try { putar.setPointerCapture(e.pointerId); } catch (_) {}
    });
    putar.addEventListener('pointermove', function (e) {
      if (!seret || e.pointerId !== seret.id) return;
      var a = sudut(e), d = ((a - seret.a + 540) % 360) - 180;
      seret.a = a;
      seret.sisa += d;
      sudutJejak += d;
      jejak.style.transform = 'rotate(' + sudutJejak + 'deg)';
      var n = Math.trunc(seret.sisa / derajat);
      if (n) { seret.sisa -= n * derajat; langkah(n); }
    });
    function lepas() { seret = null; }
    putar.addEventListener('pointerup', lepas);
    putar.addEventListener('pointercancel', lepas);

    latar.querySelectorAll('[data-n]').forEach(function (b) {
      b.addEventListener('click', function () {
        var n = Number(b.dataset.n);
        sudutJejak += n * derajat;
        langkah(n);
      });
    });
    function tutup() {
      latar.remove();
      document.removeEventListener('keydown', esc, true);
      // Beri tahu simulator/induk bahwa ada perubahan (sematan memantau event ini).
      k.dispatchEvent(new Event('change', { bubbles: true }));
    }
    function esc(e) { if (e.key === 'Escape') { e.preventDefault(); tutup(); } }
    document.addEventListener('keydown', esc, true);
    latar.querySelector('.kb-selesai').addEventListener('click', tutup);
    latar.addEventListener('pointerdown', function (e) { if (!kartu.contains(e.target)) { e.preventDefault(); tutup(); } });
  }
})();
</script>
